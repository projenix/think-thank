[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "think-thank"
version = "0.1.0"
description = "An evidence-driven, resumable autonomous research agent"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "pydantic>=2.7,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]
pdf = ["pypdf>=5,<7"]

[project.scripts]
think-thank = "think_thank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
think_thank = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
